[project]
name = "backend"
version = "0.1.0"
description = "RealWorld Conduit backend — FastAPI + SQLite"
requires-python = ">=3.12"
dependencies = [
    "bcrypt>=4.0.0,<5.0.0",
    "fastapi>=0.135.1",
    "httpx>=0.28.1",
    "python-jose>=3.5.0",
    "sqlmodel>=0.0.37",
    "uvicorn[standard]>=0.41.0",
]

[dependency-groups]
dev = [
    "anyio>=4.12.1",
    "pytest>=9.0.2",
    "pytest-cov>=7.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
